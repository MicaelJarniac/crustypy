version: 2

build:
  os: "ubuntu-26.04"
  tools:
    # Read the Docs has no 3.15 image yet; bump to match `.python-version`
    # once it does.
    python: "3.14"

# Native uv support: Read the Docs installs uv and runs `uv sync --group docs`
# against uv.lock. That also pulls the default `dev` group; uv makes the extra
# packages cheap, and it keeps this file free of custom build jobs.
# https://docs.readthedocs.com/platform/stable/config-file/v2.html#uv
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
