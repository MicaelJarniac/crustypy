version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let fresh releases settle before adopting them (supply-chain hygiene).
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Let fresh releases settle before adopting them (supply-chain hygiene).
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    # Let fresh releases settle before adopting them (supply-chain hygiene).
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
