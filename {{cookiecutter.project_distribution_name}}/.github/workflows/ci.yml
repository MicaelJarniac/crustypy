name: CI

on:
  pull_request:
  push:
    branches:
      - {{ cookiecutter.main_branch }}
      - rc

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  PRE_COMMIT_COLOR: "always"  # https://github.com/pre-commit/pre-commit/issues/2918

jobs:
  generate-jobs:
    name: Generate Session Jobs
    runs-on: ubuntu-latest
    outputs:
      session: ${{"{{"}} steps.set-matrix.outputs.session {{"}}"}}
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - id: set-matrix
      shell: bash
      run: echo session=$(uv run --frozen --only-group=automation nox --json -l | jq -c '[.[].session]') | tee --append $GITHUB_OUTPUT
  sessions:
    name: Session ${{"{{"}} matrix.session {{"}}"}}
    needs: [generate-jobs]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        session: ${{"{{"}} fromJson(needs.generate-jobs.outputs.session) {{"}}"}}
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    # Run nox from the locked `automation` group rather than wntrblm/nox, which
    # tracks `main` and always runs nox itself on Python 3.12. This way nox runs
    # on `.python-version` at the version pinned in uv.lock, and uv provides
    # each session's interpreter from `.python-versions`.
    - run: uv run --frozen --only-group=automation nox -s "${{"{{"}} matrix.session {{"}}"}}"
